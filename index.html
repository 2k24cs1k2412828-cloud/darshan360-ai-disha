<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="Darshan 360° - Official Uttar Pradesh AI Heritage, Spiritual & Cultural Travel Portal" />
      <meta name="theme-color" content="#F97316" />

      <!-- Progressive Web App (PWA) Manifest & Mobile Tags -->
      <link rel="manifest" href="/manifest.webmanifest" />
      <link rel="icon" type="image/png" href="/icons/favicon.png" />
      <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="Darshan 360°" />
      <meta name="application-name" content="Darshan 360°" />

      <title>Darshan 360° | Uttar Pradesh Tourism & Pilgrimage Portal</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      <script>
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              console.log('[Darshan 360 PWA] Active with scope:', reg.scope);
            }).catch(function(err) {
              console.warn('[Darshan 360 PWA] Registration error:', err);
            });
          });
        }
      </script>
    </body>
  </html>
